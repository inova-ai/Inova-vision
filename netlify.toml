[build.environment]
  NODE_VERSION = "22"

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**", "public/**"]

[[redirects]]
  from = "/api/webhooks/replicate"
  to = "/.netlify/functions/replicate-webhook"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."process-job-background"]
  background = true
  included_files = ["src/**", "public/**"]

[functions."replicate-webhook"]
  background = true
  included_files = ["src/**", "public/**"]
